<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuartzOS - Real-time Monitor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#b5a1ff",
                        "on-secondary-fixed": "#2b112f",
                        "surface-dim": "#161023",
                        "secondary-container": "#5a3c5d",
                        "error": "#ffb4ab",
                        "surface-container-low": "#1e182c",
                        "surface-tint": "#ccbdff",
                        "inverse-surface": "#e9def9",
                        "on-tertiary-fixed-variant": "#454747",
                        "surface": "#161023",
                        "on-tertiary": "#2f3131",
                        "on-error": "#690005",
                        "secondary-fixed": "#ffd6ff",
                        "on-tertiary-fixed": "#1a1c1c",
                        "on-primary-fixed-variant": "#4b388e",
                        "secondary": "#e1bae2",
                        "on-secondary": "#422645",
                        "on-secondary-fixed-variant": "#5a3c5d",
                        "tertiary-container": "#aeafaf",
                        "primary-fixed": "#e7deff",
                        "on-surface": "#e9def9",
                        "on-background": "#e9def9",
                        "background": "#161023",
                        "primary-fixed-dim": "#ccbdff",
                        "outline-variant": "#484551",
                        "on-surface-variant": "#cac4d3",
                        "surface-container": "#231c30",
                        "surface-variant": "#383146",
                        "secondary-fixed-dim": "#e1bae2",
                        "surface-container-lowest": "#110b1e",
                        "inverse-primary": "#6350a8",
                        "surface-bright": "#3d364b",
                        "primary": "#cfc1ff",
                        "on-primary-fixed": "#1f0060",
                        "on-tertiary-container": "#414243",
                        "on-primary-container": "#463289",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "on-secondary-container": "#cfa9d0",
                        "inverse-on-surface": "#342d42",
                        "surface-container-high": "#2d273b",
                        "on-primary": "#341e76",
                        "error-container": "#93000a",
                        "surface-container-highest": "#383146",
                        "outline": "#938e9c",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#cacaca",
                        "tertiary-fixed": "#e2e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-padding": "24px",
                        "section-margin": "48px",
                        "element-gap": "16px"
                    },
                    "fontFamily": {
                        "h2": ["Space Grotesk"],
                        "body-md": ["Space Grotesk"],
                        "h1": ["Space Grotesk"],
                        "display": ["Space Grotesk"],
                        "body-lg": ["Space Grotesk"],
                        "label-caps": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "300" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "300" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "300" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .noise-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        
        .glass-panel {
            background: rgba(18, 12, 31, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(204, 189, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .orb-glow {
            box-shadow: 0 0 60px 20px rgba(181, 161, 255, 0.2), inset 0 0 40px 10px rgba(181, 161, 255, 0.3);
            background: radial-gradient(circle at 30% 30%, rgba(207, 193, 255, 0.4) 0%, rgba(181, 161, 255, 0.1) 50%, rgba(22, 16, 35, 0.8) 100%);
            border: 1px solid rgba(204, 189, 255, 0.3);
        }
        
        .pulse-aura {
            animation: pulse-ring 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        
        .float-subtle {
            animation: float 6s ease-in-out infinite;
        }
        
        .float-subtle-delay {
            animation: float 7s ease-in-out infinite 2s;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md noise-bg relative overflow-x-hidden pt-24 pb-32">
<!-- Ambient Background Gradients -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full blur-[150px] opacity-20"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-container rounded-full blur-[150px] opacity-10"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-4 left-4 right-4 rounded-2xl border border-white/10 bg-[#120C1F]/60 backdrop-blur-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-50 shadow-[inset_0_1px_1px_rgba(255,255,255,0.1)] flex justify-between items-center px-6 h-16">
<button class="text-[#B5A1FF] hover:text-white transition-colors duration-500 active:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">blur_on</span>
</button>
<h1 class="font-['Space_Grotesk'] tracking-[0.2em] font-light text-lg font-bold tracking-[0.3em] text-transparent bg-clip-text bg-gradient-to-b from-white to-[#B5A1FF] drop-shadow-[0_0_10px_rgba(181,161,255,0.5)]">
            QUARTZOS
        </h1>
<button class="text-[#B5A1FF] hover:text-white transition-colors duration-500 active:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<main class="container mx-auto px-container-padding max-w-lg">
<!-- Live Status Indicator -->
<div class="flex justify-center items-center gap-2 mb-8 mt-4">
<div class="relative w-3 h-3">
<div class="absolute inset-0 bg-primary rounded-full pulse-aura"></div>
<div class="absolute inset-0 bg-primary rounded-full blur-[2px]"></div>
</div>
<span class="font-label-caps text-primary tracking-widest uppercase">Live Sync</span>
</div>
<!-- Main Temperature Orb -->
<div class="relative w-[280px] h-[280px] mx-auto mb-16 float-subtle">
<!-- Refraction Rings -->
<div class="absolute inset-[-20px] rounded-full border border-primary/10 border-t-primary/30 rotate-45"></div>
<div class="absolute inset-[-40px] rounded-full border border-secondary/5 border-b-secondary/20 -rotate-12"></div>
<!-- Central Orb -->
<div class="absolute inset-0 rounded-full orb-glow backdrop-blur-md flex flex-col items-center justify-center">
<span class="font-label-caps text-on-surface-variant mb-2">Current Temp</span>
<div class="font-display text-[72px] text-transparent bg-clip-text bg-gradient-to-b from-white to-primary drop-shadow-[0_0_15px_rgba(181,161,255,0.6)] leading-none">
                    545°
                </div>
<span class="font-body-md text-primary mt-2">Target: 550°</span>
</div>
</div>
<!-- Data Cards Grid -->
<div class="grid grid-cols-2 gap-4 float-subtle-delay">
<!-- Session Time -->
<div class="glass-panel rounded-2xl p-5 flex flex-col justify-between aspect-square">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-secondary/70">schedule</span>
<div class="w-2 h-2 rounded-full bg-secondary/50"></div>
</div>
<div>
<div class="font-label-caps text-on-surface-variant mb-1">Session</div>
<div class="font-h1 text-on-surface">12:45</div>
</div>
</div>
<!-- Peak Temp -->
<div class="glass-panel rounded-2xl p-5 flex flex-col justify-between aspect-square">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-primary/70">local_fire_department</span>
<span class="font-label-caps text-primary text-[10px] bg-primary/10 px-2 py-0.5 rounded-full border border-primary/20">Max</span>
</div>
<div>
<div class="font-label-caps text-on-surface-variant mb-1">Peak Temp</div>
<div class="font-h1 text-on-surface">552°</div>
</div>
</div>
<!-- Range Info (Full Width) -->
<div class="glass-panel rounded-2xl p-5 col-span-2 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-variant/50 flex items-center justify-center border border-white/5">
<span class="material-symbols-outlined text-on-surface-variant">tune</span>
</div>
<div>
<div class="font-label-caps text-on-surface-variant mb-0.5">Optimal Range</div>
<div class="font-body-lg text-on-surface">520° - 560° F</div>
</div>
</div>
<div class="h-8 w-16 bg-surface-container-highest rounded-full p-1 relative">
<div class="absolute top-1 bottom-1 left-1 w-1/2 bg-gradient-to-r from-secondary-container to-primary-container rounded-full"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 left-6 right-6 h-20 z-50 flex justify-around items-center px-4 bg-[#120C1F]/80 backdrop-blur-3xl rounded-[32px] border border-white/5 border-t border-white/10 shadow-[0_-10px_40px_rgba(181,161,255,0.1)] md:hidden">
<!-- Tab 1: Active (Home/Monitor) -->
<button class="flex flex-col items-center justify-center text-[#B5A1FF] drop-shadow-[0_0_15px_rgba(181,161,255,1)] scale-110 animate-pulse-slow active:scale-90 hover:text-white/60 transition-all">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">flare</span>
</button>
<!-- Tab 2: Inactive -->
<button class="flex flex-col items-center justify-center text-white/30 hover:text-white/60 transition-all active:scale-90">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">diamond</span>
</button>
<!-- Tab 3: Inactive -->
<button class="flex flex-col items-center justify-center text-white/30 hover:text-white/60 transition-all active:scale-90">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">auto_awesome</span>
</button>
<!-- Tab 4: Inactive -->
<button class="flex flex-col items-center justify-center text-white/30 hover:text-white/60 transition-all active:scale-90">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">settings_input_component</span>
</button>
</nav>
</body></html>
