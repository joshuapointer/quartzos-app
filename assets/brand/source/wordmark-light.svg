<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <!-- Quartzie wordmark — light (bone) on void obsidian. Use on dark surfaces. -->
  <rect width="1200" height="320" fill="#050403"/>

  <text x="600" y="190"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="400"
        font-size="156"
        fill="#f4ede4"
        letter-spacing="-2">quartzie</text>

  <!-- ember accent dot (the at-target signal) -->
  <circle cx="900" cy="180" r="9" fill="#E89240"/>

  <!-- Tagline below: ritual instrument -->
  <text x="600" y="248"
        text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="500"
        font-size="20"
        letter-spacing="6"
        fill="#9e907e">RITUAL  INSTRUMENT</text>
</svg>
