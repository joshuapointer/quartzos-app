<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Quartzie OG hero — open-graph share image, 1200×630.
    Composition: monogram on the left, wordmark + tagline on the right.
    Background: warm obsidian with a subtle ember vignette.
  -->
  <defs>
    <radialGradient id="bgVignette" cx="0.35" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#0c0908"/>
      <stop offset="1" stop-color="#050403"/>
    </radialGradient>
    <radialGradient id="lensTarget" cx="0.42" cy="0.38" r="0.82">
      <stop offset="0" stop-color="#5E2E0C"/>
      <stop offset="0.55" stop-color="#2a2320"/>
      <stop offset="1" stop-color="#0c0908"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#E89240" stop-opacity="0.30"/>
      <stop offset="0.60" stop-color="#E89240" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#E89240" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A055"/>
      <stop offset="0.55" stop-color="#E89240"/>
      <stop offset="1" stop-color="#C97326"/>
    </linearGradient>
    <linearGradient id="ringGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede4" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#f4ede4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgVignette)"/>

  <!-- Monogram on the left, centered vertically -->
  <g transform="translate(115 165) scale(0.293)">
    <!-- ambient halo -->
    <circle cx="512" cy="512" r="460" fill="url(#emberGlow)"/>
    <!-- lens -->
    <circle cx="512" cy="512" r="320" fill="url(#lensTarget)"/>
    <!-- gloss -->
    <ellipse cx="512" cy="370" rx="240" ry="100" fill="url(#ringGloss)"/>
    <!-- ring -->
    <circle cx="512" cy="512" r="382" fill="none" stroke="url(#ringStroke)" stroke-width="42"/>
    <!-- descender -->
    <path d="M 800 718 L 910 828" stroke="url(#ringStroke)" stroke-width="42" stroke-linecap="round" fill="none"/>
    <!-- terminal -->
    <circle cx="932" cy="852" r="26" fill="#E89240"/>
    <circle cx="932" cy="852" r="52" fill="#E89240" opacity="0.18"/>
    <!-- top tick -->
    <line x1="512" y1="100" x2="512" y2="138" stroke="#f4ede4" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Wordmark and tagline on the right -->
  <text x="510" y="315"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="400"
        font-size="148"
        fill="#f4ede4"
        letter-spacing="-2">quartzie</text>

  <text x="510" y="368"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="500"
        font-size="18"
        letter-spacing="5"
        fill="#9e907e">RITUAL  INSTRUMENT</text>

  <!-- Hairline divider -->
  <line x1="510" y1="402" x2="640" y2="402" stroke="#6d6050" stroke-width="1.5"/>

  <text x="510" y="450"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="400"
        font-size="22"
        fill="#c7b8a4">Companion app for the Dab Rite PRO v2.2.</text>
  <text x="510" y="482"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="400"
        font-size="22"
        fill="#c7b8a4">Real-time temperature, precisely controlled.</text>
</svg>
