<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Android adaptive-icon FOREGROUND.
    Per Android docs, the safe-zone is a 66dp circle inside the 108dp canvas
    (i.e. the icon foreground may be cropped to a circle, square, squircle,
    teardrop, etc.). The visible mark MUST stay inside the central 66% diameter
    so it survives every mask. Background lives in app.json android.adaptiveIcon.backgroundColor.
    Foreground here is fully transparent outside the central mark area.
  -->
  <defs>
    <radialGradient id="lensTarget" cx="0.42" cy="0.38" r="0.82">
      <stop offset="0" stop-color="#5E2E0C" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#2a2320" stop-opacity="1"/>
      <stop offset="1" stop-color="#0c0908" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#E89240" stop-opacity="0.32"/>
      <stop offset="0.60" stop-color="#E89240" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#E89240" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede4" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#f4ede4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A055"/>
      <stop offset="0.55" stop-color="#E89240"/>
      <stop offset="1" stop-color="#C97326"/>
    </linearGradient>
  </defs>

  <!-- Transparent canvas - the system applies background -->
  <!-- safe-zone diameter: 1024 * 0.66 = ~676 → mark fits within radius 338 from center. -->

  <!-- Ambient ember halo (scaled down to safe zone) -->
  <circle cx="512" cy="512" r="320" fill="url(#emberGlow)"/>

  <!-- Inner lens -->
  <circle cx="512" cy="512" r="220" fill="url(#lensTarget)"/>

  <!-- Specular bone gloss on lens -->
  <ellipse cx="512" cy="416" rx="170" ry="70" fill="url(#ringGloss)"/>

  <!-- Outer ring (slightly thinner because mark is smaller) -->
  <circle cx="512" cy="512" r="270" fill="none" stroke="url(#ringStroke)" stroke-width="32"/>

  <!-- Q descender — kept short to fit safe-zone -->
  <path d="M 712 660 L 778 726"
        stroke="url(#ringStroke)" stroke-width="32" stroke-linecap="round" fill="none"/>

  <!-- Ember terminal -->
  <circle cx="794" cy="742" r="20" fill="#E89240"/>
  <circle cx="794" cy="742" r="38" fill="#E89240" opacity="0.18"/>

  <!-- 12 o'clock target tick -->
  <line x1="512" y1="216" x2="512" y2="244" stroke="#f4ede4" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
</svg>
