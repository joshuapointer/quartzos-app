<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Quartzie monogram — the Q-as-dial mark.
    Concept: the bowl of the Q is the TempDial ring at fired-amber at-target;
    the descender is the heat-trace tangent leaving the ring at ~4-5 o'clock.
    Background: void-obsidian (#050403).
    Stroke: fired-amber (#E89240).
    Lens: warm dark gradient that reads "lensTarget" (#5E2E0C → #1c1714).
    The whole figure occupies ~70% of the canvas so it remains comfortable
    inside Android adaptive-icon safe-zone (66% diameter circle).
  -->
  <defs>
    <radialGradient id="lensTarget" cx="0.42" cy="0.38" r="0.82">
      <stop offset="0" stop-color="#5E2E0C" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#2a2320" stop-opacity="1"/>
      <stop offset="1" stop-color="#0c0908" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#E89240" stop-opacity="0.32"/>
      <stop offset="0.60" stop-color="#E89240" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#E89240" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede4" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#f4ede4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A055"/>
      <stop offset="0.55" stop-color="#E89240"/>
      <stop offset="1" stop-color="#C97326"/>
    </linearGradient>
  </defs>

  <!-- Void obsidian field -->
  <rect width="1024" height="1024" fill="#050403"/>

  <!-- Ambient ember halo behind the dial -->
  <circle cx="512" cy="512" r="430" fill="url(#emberGlow)"/>

  <!-- Inner lens (the dial face) -->
  <circle cx="512" cy="512" r="290" fill="url(#lensTarget)"/>

  <!-- Specular bone gloss on the upper edge of the lens -->
  <ellipse cx="512" cy="370" rx="220" ry="90" fill="url(#ringGloss)"/>

  <!-- Outer ring (fired amber, at-target) -->
  <circle cx="512" cy="512" r="350" fill="none" stroke="url(#ringStroke)" stroke-width="38"/>

  <!-- Q-descender heat trace: tangent from ring at ~4 o'clock,
       sweeping out to a small ember terminal -->
  <path d="M 770 690 L 880 800"
        stroke="url(#ringStroke)" stroke-width="38" stroke-linecap="round" fill="none"/>

  <!-- Ember terminal dot at the descender tip -->
  <circle cx="900" cy="820" r="22" fill="#E89240"/>
  <circle cx="900" cy="820" r="44" fill="#E89240" opacity="0.18"/>

  <!-- Hairline bone notch at top of ring (12-o'clock target tick) -->
  <line x1="512" y1="146" x2="512" y2="180" stroke="#f4ede4" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>
