<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Quartzie grain texture — 512×512 noise overlay for QBackground.
    Use at ~3% opacity. Tiled, no seam.
  -->
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.957
        0 0 0 0 0.929
        0 0 0 0 0.894
        0 0 0 0.55 0"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#050403"/>
  <rect width="512" height="512" filter="url(#noise)"/>
</svg>
