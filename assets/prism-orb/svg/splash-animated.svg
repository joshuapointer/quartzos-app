<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="bg-deep" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="oklch(0.13 0.03 250)"/>
      <stop offset="50%" stop-color="oklch(0.09 0.02 250)"/>
      <stop offset="100%" stop-color="oklch(0.05 0.01 250)"/>
    </radialGradient>
    <radialGradient id="bg-prism-tl" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="oklch(0.18 0.06 220 / 0.40)"/>
      <stop offset="55%" stop-color="oklch(0.05 0.01 250 / 0)"/>
    </radialGradient>
    <radialGradient id="bg-prism-br" cx="75%" cy="80%" r="80%">
      <stop offset="0%" stop-color="oklch(0.13 0.06 320 / 0.35)"/>
      <stop offset="60%" stop-color="oklch(0.05 0.01 250 / 0)"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="34%" r="68%">
      <stop offset="0%" stop-color="oklch(0.95 0.05 220)"/>
      <stop offset="22%" stop-color="oklch(0.78 0.10 215)"/>
      <stop offset="58%" stop-color="oklch(0.42 0.14 270)"/>
      <stop offset="86%" stop-color="oklch(0.18 0.08 280)"/>
      <stop offset="100%" stop-color="oklch(0.10 0.04 260)"/>
    </radialGradient>
    <radialGradient id="orb-iris" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="oklch(0.78 0.18 290 / 0)"/>
      <stop offset="55%" stop-color="oklch(0.74 0.22 320 / 0.36)"/>
      <stop offset="100%" stop-color="oklch(0.84 0.16 200 / 0)"/>
    </radialGradient>
    <radialGradient id="orb-spec" cx="36%" cy="30%" r="22%">
      <stop offset="0%" stop-color="oklch(0.99 0.02 220 / 0.92)"/>
      <stop offset="60%" stop-color="oklch(0.95 0.04 220 / 0.18)"/>
      <stop offset="100%" stop-color="oklch(0.99 0.02 220 / 0)"/>
    </radialGradient>
    <radialGradient id="orb-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="oklch(0.74 0.18 280 / 0.35)"/>
      <stop offset="100%" stop-color="oklch(0.55 0.18 270 / 0)"/>
    </radialGradient>
    <linearGradient id="prism-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(0.84 0.12 200)"/>
      <stop offset="50%" stop-color="oklch(0.78 0.18 320)"/>
      <stop offset="100%" stop-color="oklch(0.90 0.14 95)"/>
    </linearGradient>
    <filter id="orb-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0">
        <animate attributeName="stdDeviation" from="14" to="0" dur="0.55s" begin="0s" fill="freeze"/>
      </feGaussianBlur>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg-deep)"/>
  <rect width="1080" height="1920" fill="url(#bg-prism-tl)"/>
  <rect width="1080" height="1920" fill="url(#bg-prism-br)"/>

  <!-- Mark group: scales in with spring -->
  <g transform="translate(540, 880)" filter="url(#orb-blur)" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="0.55s" begin="0s" fill="freeze"/>
    <g transform="scale(0.65)">
      <animateTransform attributeName="transform" type="scale"
        values="0.65;1.05;1.0" keyTimes="0;0.7;1" dur="0.85s" begin="0s" fill="freeze"
        calcMode="spline" keySplines="0.22 1.4 0.36 1; 0.16 0.84 0.24 1"/>
      <circle r="240" fill="url(#orb-glow)"/>
      <circle r="220" fill="url(#orb)"/>
      <circle r="220" fill="url(#orb-iris)" opacity="0.75"/>
      <circle r="220" fill="url(#orb-spec)"/>
    </g>
  </g>

  <!-- Chromatic arc: traces clockwise from 12 o'clock, tight halo around the orb -->
  <g transform="translate(540, 880) rotate(-90)">
    <circle r="232" fill="none" stroke="url(#prism-stroke)" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="1457.74" stroke-dashoffset="1457.74" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.25s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="1457.74" to="0" dur="1.1s" begin="0.25s"
               fill="freeze" calcMode="spline" keySplines="0.16 0.84 0.24 1"/>
    </circle>
  </g>

  <!-- Wordmark: fades up -->
  <g opacity="0" transform="translate(0, 8)">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0"
                      dur="0.7s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 0.84 0.24 1"/>
    <text x="540" y="1260" text-anchor="middle"
          font-family="'Instrument Serif', 'Iowan Old Style', Charter, Georgia, serif"
          font-style="italic" font-size="108" fill="oklch(0.97 0.012 230)" letter-spacing="0.005em">Quartzie</text>
  </g>

  <!-- Progress dots: stagger in with the rest -->
  <g transform="translate(540, 1780)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <circle cx="-22" cy="0" r="6" fill="oklch(0.84 0.12 200)"/>
    <circle cx="0"   cy="0" r="6" fill="oklch(0.78 0.18 320)"/>
    <circle cx="22"  cy="0" r="6" fill="oklch(0.90 0.14 95)"/>
  </g>
</svg>
