<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="bg-deep" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="oklch(0.13 0.03 250)"/>
      <stop offset="50%" stop-color="oklch(0.09 0.02 250)"/>
      <stop offset="100%" stop-color="oklch(0.05 0.01 250)"/>
    </radialGradient>
    <radialGradient id="bg-prism-tl" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="oklch(0.18 0.06 220 / 0.40)"/>
      <stop offset="55%" stop-color="oklch(0.05 0.01 250 / 0)"/>
    </radialGradient>
    <radialGradient id="bg-prism-br" cx="75%" cy="80%" r="80%">
      <stop offset="0%" stop-color="oklch(0.13 0.06 320 / 0.35)"/>
      <stop offset="60%" stop-color="oklch(0.05 0.01 250 / 0)"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="34%" r="68%">
      <stop offset="0%" stop-color="oklch(0.95 0.05 220)"/>
      <stop offset="22%" stop-color="oklch(0.78 0.10 215)"/>
      <stop offset="58%" stop-color="oklch(0.42 0.14 270)"/>
      <stop offset="86%" stop-color="oklch(0.18 0.08 280)"/>
      <stop offset="100%" stop-color="oklch(0.10 0.04 260)"/>
    </radialGradient>
    <radialGradient id="orb-iris" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="oklch(0.78 0.18 290 / 0)"/>
      <stop offset="55%" stop-color="oklch(0.74 0.22 320 / 0.36)"/>
      <stop offset="100%" stop-color="oklch(0.84 0.16 200 / 0)"/>
    </radialGradient>
    <radialGradient id="orb-spec" cx="36%" cy="30%" r="22%">
      <stop offset="0%" stop-color="oklch(0.99 0.02 220 / 0.92)"/>
      <stop offset="60%" stop-color="oklch(0.95 0.04 220 / 0.18)"/>
      <stop offset="100%" stop-color="oklch(0.99 0.02 220 / 0)"/>
    </radialGradient>
    <radialGradient id="orb-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="oklch(0.74 0.18 280 / 0.35)"/>
      <stop offset="100%" stop-color="oklch(0.55 0.18 270 / 0)"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg-deep)"/>
  <rect width="1080" height="1920" fill="url(#bg-prism-tl)"/>
  <rect width="1080" height="1920" fill="url(#bg-prism-br)"/>

  <!-- Mark, centered slightly above geometric center -->
  <g transform="translate(540, 880)">
    <circle r="220" fill="url(#orb-glow)"/>
    <circle r="196" fill="url(#orb)"/>
    <circle r="196" fill="url(#orb-iris)" opacity="0.75"/>
    <circle r="196" fill="url(#orb-spec)"/>
  </g>

  <!-- Wordmark -->
  <text x="540" y="1180" text-anchor="middle"
        font-family="'Instrument Serif', 'Iowan Old Style', Charter, Georgia, serif"
        font-style="italic" font-size="108" fill="oklch(0.97 0.012 230)"
        letter-spacing="0.005em">Quartzie</text>

  <!-- Progress dots -->
  <g transform="translate(540, 1780)">
    <circle cx="-22" cy="0" r="6" fill="oklch(0.84 0.12 200)"/>
    <circle cx="0"   cy="0" r="6" fill="oklch(0.78 0.18 320)"/>
    <circle cx="22"  cy="0" r="6" fill="oklch(0.90 0.14 95)"/>
  </g>
</svg>
