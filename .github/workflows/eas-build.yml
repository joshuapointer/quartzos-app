name: EAS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, production]
      platform:
        description: Platform
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      submit:
        description: Submit to stores after build (production only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.profile || 'preview' }} / ${{ inputs.platform || 'all' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: |
          eas build \
            --profile "${{ inputs.profile || 'preview' }}" \
            --platform "${{ inputs.platform || 'all' }}" \
            --non-interactive

      - name: Submit to stores
        if: inputs.submit && inputs.profile == 'production'
        run: |
          eas submit \
            --platform "${{ inputs.platform || 'all' }}" \
            --latest \
            --non-interactive
