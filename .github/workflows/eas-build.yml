# Native iOS build on a GitHub macOS runner via `eas build --local`.
#
# Triggers:
#   - push to main / preview / development / develop
#   - AND only when native-affecting files changed
#
# Output:
#   - .ipa stored as a GitHub Actions artifact (30-day retention).
#   - NO automatic submission. Manual `eas submit --path <ipa>` only,
#     when the user is ready to ship.
#
# Branch -> profile mapping (matches OTA branch mapping):
#   main         -> production
#   preview      -> preview
#   development  -> development
#   develop      -> development
#
# iOS code signing uses EAS-managed credentials. The CLI fetches the
# distribution certificate and provisioning profile from EAS servers
# using EXPO_TOKEN (no Apple secrets needed in this repo).
name: EAS Build (iOS)

on:
  push:
    branches:
      - main
      - preview
      - development
      - develop
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (development/preview/production)"
        required: false
        default: "development"

permissions:
  contents: read

jobs:
  detect:
    name: Detect native-affecting changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.decide.outputs.native }}
      profile: ${{ steps.decide.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'ios/**'
              - 'android/**'
              - 'app.json'
              - 'app.config.*'
              - 'package.json'
              - 'package-lock.json'
              - 'eas.json'

      - name: Decide whether to build and which profile
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          PUSH_NATIVE: ${{ steps.changes.outputs.native }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NATIVE="true"
            PROFILE="${DISPATCH_PROFILE:-development}"
            echo "Manual dispatch -> profile '$PROFILE'"
          else
            NATIVE="$PUSH_NATIVE"
            if [ "$NATIVE" = "true" ]; then
              case "$REF" in
                main)                PROFILE="production" ;;
                preview)             PROFILE="preview" ;;
                development|develop) PROFILE="development" ;;
                *)
                  echo "Unsupported branch '$REF' for build workflow." >&2
                  exit 1
                  ;;
              esac
              echo "Mapped ref '$REF' -> EAS build profile '$PROFILE'"
            else
              PROFILE=""
            fi
          fi
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Skip notice (no native changes)
        if: steps.decide.outputs.native != 'true'
        run: |
          echo "::notice::No native-affecting changes on ${{ github.ref_name }} — skipping iOS build."
          echo "EAS Update workflow will publish the OTA bundle for this commit."

  build-ios:
    name: Build iOS .ipa locally on macOS runner
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: [self-hosted, macOS, quartzos]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS locally with EAS-managed credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1
        run: |
          mkdir -p dist
          eas build \
            --platform ios \
            --profile "${{ needs.detect.outputs.profile }}" \
            --local \
            --non-interactive \
            --output "dist/quartzie-ios-${{ needs.detect.outputs.profile }}.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: quartzie-ios-${{ needs.detect.outputs.profile }}-${{ github.sha }}
          path: dist/quartzie-ios-${{ needs.detect.outputs.profile }}.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Submission reminder
        run: |
          echo "::notice title=Build complete::iOS .ipa attached as run artifact. To submit, download it and run 'eas submit --platform ios --path <ipa>' locally. This workflow does not auto-submit."
