# EAS Updates only. This repo does NOT trigger EAS Build from CI.
# Native binaries are built manually via `eas build` when a release is cut.
# If you ever add a build step here, make it explicit and gated on a tag.
name: EAS Update

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          eas update \
            --branch "$BRANCH_NAME" \
            --message "$COMMIT_MSG" \
            --platform all \
            --non-interactive

      - name: Route production channel to main
        if: github.ref_name == 'main'
        run: eas channel:edit production --branch main --non-interactive
