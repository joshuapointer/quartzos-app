<body class="bg-black text-on-surface min-h-screen relative overflow-hidden flex flex-col items-center">
<!-- Atmospheric Flares Background -->
<div class="fixed inset-0 pointer-events-none z-[-1]">
<!-- Top flare -->
<div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[800px] h-[600px] bg-primary/10 rounded-full blur-[120px] mix-blend-screen opacity-60"></div>
<!-- Bottom scattered flares -->
<div class="absolute bottom-[-20%] left-[-10%] w-[600px] h-[600px] bg-surface-container/30 rounded-full blur-[100px] mix-blend-screen opacity-40"></div>
<div class="absolute bottom-[10%] right-[-10%] w-[500px] h-[500px] bg-outline/10 rounded-full blur-[90px] mix-blend-screen opacity-30"></div>
</div>
<!-- Header / Persistent Orb -->
<header class="w-full flex flex-col items-center pt-md pb-lg z-10">
<!-- Breathing Orb -->
<div class="w-16 h-16 rounded-full bg-primary-container shadow-[0_0_30px_rgba(255,122,0,0.6)] flex items-center justify-center mb-md scale-90 relative">
<!-- Glow layers -->
<div class="absolute inset-0 rounded-full bg-primary-fixed blur-[10px] opacity-50 mix-blend-screen"></div>
<div class="absolute inset-2 rounded-full bg-white/20 blur-[2px]"></div>
<span class="material-symbols-outlined text-surface font-light text-2xl z-10" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface text-center px-container-padding">Start a sesh.</h1>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-4xl px-container-padding flex flex-col gap-lg pb-xl z-10 flex-grow">
<!-- New Sesh Floating Glass Bubble -->
<button class="group w-full max-w-sm mx-auto relative flex flex-col items-center justify-center p-md rounded-xl bg-white/5 backdrop-blur-[22px] backdrop-saturate-[1.2] border-t-[0.5px] border-l-[0.5px] border-white/30 shadow-[0_0_40px_rgba(0,0,0,0.5)] transition-all duration-500 hover:bg-white/10 overflow-hidden">
<!-- Internal gradient surface volume -->
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-white/0 pointer-events-none rounded-xl"></div>
<div class="w-20 h-20 rounded-full bg-primary-container shadow-[0_0_20px_rgba(255,122,0,0.4)] flex items-center justify-center mb-sm group-hover:scale-105 transition-transform duration-500 relative z-10">
<span class="material-symbols-outlined text-surface text-4xl" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface tracking-tight relative z-10">New sesh</span>
</button>
<!-- Saved Presets Section -->
<section class="flex flex-col gap-sm w-full max-w-2xl mx-auto mt-md">
<!-- Section Header Tag -->
<div class="w-fit mb-xs">
<span class="px-sm py-xs rounded-full bg-white/5 backdrop-blur-[22px] border-t-[0.5px] border-l-[0.5px] border-white/30 font-data-label text-data-label text-outline uppercase tracking-widest inline-block shadow-[0_4px_16px_rgba(0,0,0,0.3)]">SAVED</span>
</div>

<div class="flex flex-col gap-unit">

<button class="w-full flex items-center justify-between p-sm rounded-full bg-white/2 backdrop-blur-[22px] backdrop-saturate-[1.2] border-t-[0.5px] border-l-[0.5px] border-white/20 hover:border-primary/50 hover:bg-white/5 transition-all duration-300 group shadow-[0_8px_32px_rgba(0,0,0,0.4)] relative overflow-hidden">
<!-- Glass volume -->
<div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent opacity-50 pointer-events-none rounded-full"></div>
<div class="flex items-center gap-sm relative z-10">
<div class="w-12 h-12 rounded-full border-[0.5px] border-white/10 flex items-center justify-center bg-black/40 group-hover:border-primary/30 transition-colors">

</div>
<div class="flex flex-col items-start">
<span class="font-headline-md text-headline-md text-on-surface text-[20px]">Deep Focus</span>
<span class="font-data-value text-data-value text-outline">Binaural • 45m</span>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors pr-xs relative z-10">play_arrow</span>
</button>

<div class="flex flex-col items-start">

</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-tertiary transition-colors pr-xs relative z-10">play_arrow</span>

</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-on-surface transition-colors pr-xs relative z-10">play_arrow</span>
</button>
