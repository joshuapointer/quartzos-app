            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden selection:bg-primary-container selection:text-background">
<!-- Ambient Lighting Blooms -->
<div class="fixed top-[-15%] left-[-15%] w-[600px] h-[600px] bg-primary-container/10 blur-[150px] rounded-full pointer-events-none mix-blend-screen"></div>
<div class="fixed bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-tertiary-container/5 blur-[120px] rounded-full pointer-events-none mix-blend-screen"></div>
<!-- Main Content Cluster -->
<main class="relative z-10 flex flex-col items-center justify-center p-container-padding max-w-2xl w-full">
<!-- Multi-layered Refractive Glass Orb (Idle State) -->
<div class="relative flex items-center justify-center w-[280px] h-[280px] mb-lg group">
<!-- External diffuse glow -->
<div class="absolute inset-0 bg-tertiary-container/20 rounded-full blur-[60px] scale-110"></div>
<!-- Outer Glass Shell -->
<div class="relative w-full h-full rounded-full backdrop-blur-[22px] backdrop-saturate-[1.2] border-t-[0.5px] border-l-[0.5px] border-white/30 bg-gradient-to-br from-white/[0.05] to-transparent shadow-[inset_0_0_40px_rgba(255,255,255,0.05),0_10px_40px_rgba(0,0,0,0.8)] flex items-center justify-center">
<!-- Mid Layer Refraction -->
<div class="w-[180px] h-[180px] rounded-full border border-tertiary-container/10 bg-tertiary-container/[0.02] backdrop-blur-md flex items-center justify-center shadow-[inset_0_0_20px_rgba(0,168,255,0.1)]">
<!-- Core Emitter (Idle Cool Blue) -->
<div class="w-[80px] h-[80px] rounded-full bg-gradient-to-tr from-tertiary-container/40 to-transparent blur-[8px] shadow-[0_0_30px_rgba(0,168,255,0.3)]"></div>
</div>
<!-- Optical Highlight (Top curved reflection) -->
<div class="absolute top-[5%] left-[15%] right-[15%] h-[20%] rounded-t-full bg-gradient-to-b from-white/10 to-transparent blur-[2px] opacity-70"></div>
</div>
</div>
<!-- Etched Typography -->
<h1 class="font-display-lg text-display-lg text-on-surface text-center mb-xl tracking-tight drop-shadow-[0_0_12px_rgba(246,222,210,0.15)] max-w-md">
            Connect your Dab Rite to begin.
        </h1>
<!-- Emissive Amber Pill Button -->
<button class="group relative px-10 py-5 rounded-full bg-primary-container hover:bg-primary transition-colors duration-500 shadow-[0_0_25px_rgba(255,122,0,0.4)] hover:shadow-[0_0_40px_rgba(255,122,0,0.6)] flex items-center gap-4">
<!-- Inner pill for text clarity -->
<span class="font-data-label text-data-label text-background uppercase tracking-[0.15em]">
                CONNECT DAB RITE
            </span>
<!-- Decorative technical indicator inside button -->
<span class="w-1.5 h-1.5 rounded-full bg-background/50 animate-pulse"></span>
</button>
</main>
