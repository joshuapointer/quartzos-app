<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        /* Custom scrollbar and base adjustments */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-container-lowest text-on-background min-h-screen flex flex-col items-center justify-center p-container-padding relative overflow-hidden font-body-main text-body-main selection:bg-primary-container/20">
<!-- Atmospheric background light bleed -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(255,122,0,0.03)_0%,rgba(28,17,10,0)_60%)] pointer-events-none"></div>
<!-- Main Content Canvas (No Nav Shell due to completion/transactional intent) -->
<main class="w-full max-w-[360px] flex flex-col items-center z-10">
<!-- Glowing Complete Orb -->
<div class="w-6 h-6 rounded-full bg-primary-container shadow-[0_0_24px_rgba(255,122,0,0.8)] mb-lg relative">
<div class="absolute inset-0 rounded-full bg-white/20 animate-pulse mix-blend-overlay"></div>
</div>
<!-- Typography Anchor -->
<div class="flex flex-col items-center text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Sesh logged.</h1>
<div class="font-display-lg text-display-lg text-primary-container drop-shadow-[0_0_12px_rgba(255,122,0,0.3)]">4:20</div>
</div>
<!-- Glassmorphism Summary Card -->
<div class="w-full bg-gradient-to-br from-white/[0.05] to-white/[0.02] backdrop-blur-[22px] backdrop-saturate-[1.2] border-t-[0.5px] border-l-[0.5px] border-white/30 rounded-lg p-md flex flex-col gap-element-gap relative mb-xl shadow-[0_16px_32px_rgba(0,0,0,0.5)]">
<!-- Top rim highlight for thickness -->
<div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/40 to-transparent"></div>
<!-- Etched Data Rows -->
<div class="flex items-end justify-between border-b border-white/[0.05] pb-sm">
<span class="font-data-label text-data-label text-secondary">PROFILE</span>
<span class="font-data-value text-data-value text-on-surface drop-shadow-[0_0_4px_rgba(246,222,210,0.2)]">S-17</span>
</div>
<div class="flex items-end justify-between border-b border-white/[0.05] pb-sm">
<span class="font-data-label text-data-label text-secondary">MATERIAL</span>
<span class="font-data-value text-data-value text-on-surface drop-shadow-[0_0_4px_rgba(246,222,210,0.2)]">FLOWER</span>
</div>
<div class="flex items-end justify-between">
<span class="font-data-label text-data-label text-secondary">PEAK TEMP</span>
<div class="flex items-baseline gap-xs drop-shadow-[0_0_4px_rgba(246,222,210,0.2)]">
<span class="font-data-value text-data-value text-on-surface">385°</span>
<span class="font-data-label text-data-label text-primary-container">F</span>
</div>
</div>
</div>
<!-- Emissive Amber Pill Button -->
<button class="w-full max-w-[280px] py-4 rounded-full bg-primary-container text-on-primary-container font-data-label text-data-label uppercase tracking-widest shadow-[0_0_20px_rgba(255,122,0,0.4)] hover:shadow-[0_0_32px_rgba(255,122,0,0.6)] hover:bg-surface-tint hover:-translate-y-[1px] transition-all duration-300 flex items-center justify-center relative overflow-hidden">
<span class="relative z-10">NEW SESH</span>
<!-- Inner pill highlight -->
<div class="absolute inset-x-4 top-1 h-[2px] bg-white/20 rounded-full blur-[1px]"></div>
</button>
</main>
</body></html>
