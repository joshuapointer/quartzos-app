<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Session Cool - Active Coaching</title>
<!-- Google Fonts: Material Symbols & Geist -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&amp;family=Geist:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed": "#161c26",
                        "background": "#1c110a",
                        "tertiary": "#95ccff",
                        "surface-container-high": "#35271f",
                        "on-background": "#f6ded2",
                        "surface": "#1c110a",
                        "outline-variant": "#584235",
                        "surface-container": "#291d16",
                        "on-tertiary-fixed": "#001d32",
                        "error-container": "#93000a",
                        "on-tertiary": "#003352",
                        "surface-variant": "#40322a",
                        "on-primary-container": "#5c2800",
                        "tertiary-fixed": "#cde5ff",
                        "surface-container-low": "#251912",
                        "surface-container-lowest": "#160c06",
                        "primary-fixed": "#ffdbc8",
                        "inverse-on-surface": "#3b2d26",
                        "error": "#ffb4ab",
                        "secondary-container": "#414753",
                        "secondary-fixed-dim": "#c1c6d5",
                        "surface-container-highest": "#40322a",
                        "surface-tint": "#ffb68b",
                        "on-secondary-fixed-variant": "#414753",
                        "on-primary-fixed": "#321200",
                        "primary-fixed-dim": "#ffb68b",
                        "primary": "#ffb68b",
                        "tertiary-fixed-dim": "#95ccff",
                        "on-primary": "#522300",
                        "on-secondary": "#2b313c",
                        "secondary": "#c1c6d5",
                        "on-error": "#690005",
                        "primary-container": "#ff7a00",
                        "outline": "#a78b7c",
                        "inverse-surface": "#f6ded2",
                        "surface-bright": "#45362e",
                        "on-primary-fixed-variant": "#753400",
                        "on-secondary-container": "#b0b5c3",
                        "inverse-primary": "#994700",
                        "on-tertiary-container": "#003a5c",
                        "secondary-fixed": "#dde2f1",
                        "on-surface-variant": "#e0c0af",
                        "on-tertiary-fixed-variant": "#004a75",
                        "tertiary-container": "#00a8ff",
                        "on-error-container": "#ffdad6",
                        "surface-dim": "#1c110a",
                        "on-surface": "#f6ded2"
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        lg: "2rem",
                        xl: "3rem",
                        full: "9999px"
                    },
                    spacing: {
                        unit: "4px",
                        "element-gap": "24px",
                        xl: "128px",
                        xs: "8px",
                        "container-padding": "40px",
                        sm: "16px",
                        md: "32px",
                        lg: "64px"
                    },
                    fontFamily: {
                        "headline-md": ["Geist"],
                        "data-value": ["Geist Mono"],
                        "body-main": ["Geist"],
                        "display-lg": ["Geist"],
                        "data-label": ["Geist Mono"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "400" }],
                        "data-value": ["14px", { lineHeight: "1.4", letterSpacing: "0em", fontWeight: "400" }],
                        "body-main": ["16px", { lineHeight: "1.6", letterSpacing: "0em", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.04em", fontWeight: "300" }],
                        "data-label": ["12px", { lineHeight: "1.0", letterSpacing: "0.1em", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            /* Fallback font mapping if Geist fails to load */
            font-family: 'Geist', sans-serif;
        }
        .font-data-value, .font-data-label {
            font-family: 'Geist Mono', monospace;
        }
        
        /* Optical Elevation Base Classes */
        .glass-panel {
            @apply bg-gradient-to-br from-white/5 to-white/0 backdrop-blur-[22px] backdrop-saturate-[1.2] border-t-[0.5px] border-l-[0.5px] border-white/30;
        }
        
        .emissive-pill {
            @apply bg-primary-container text-on-primary-container shadow-[0_0_20px_rgba(255,122,0,0.4)] border border-primary-container/50;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-background h-screen w-full overflow-hidden flex flex-col items-center relative">
<!-- Atmospheric Navy Bloom (Bottom) -->
<div class="absolute bottom-[-10%] left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-tertiary-container/15 blur-[120px] rounded-[100%] pointer-events-none z-0"></div>
<!-- Minimal Task Header (Escape Route) -->
<header class="w-full flex items-center justify-between px-container-padding py-sm z-50">
<button aria-label="Abort Session" class="flex items-center justify-center w-10 h-10 rounded-full glass-panel text-on-background/70 hover:text-on-background transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="font-data-label text-data-label text-on-background/50 tracking-widest">
            S-11 SESSION
        </div>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Coaching Canvas -->
<main class="flex-1 w-full flex flex-col items-center justify-start pt-lg z-10 relative px-container-padding">
<!-- The Massive Coaching Orb -->
<div class="relative w-[300px] h-[300px] flex items-center justify-center mt-md">
<!-- Progress Arc (Cooling) -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90 pointer-events-none" viewbox="0 0 100 100">
<!-- Track Background -->
<circle class="stroke-white/10" cx="50" cy="50" fill="none" r="48" stroke-width="1.5"></circle>
<!-- Active Cooling Progress -->
<circle class="text-tertiary-container drop-shadow-[0_0_10px_rgba(0,168,255,0.4)]" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-dasharray="301" stroke-dashoffset="140" stroke-linecap="round" stroke-width="1.5"></circle>
</svg>
<!-- Inner Glass Orb -->
<div class="absolute inset-[10px] rounded-full glass-panel shadow-[inset_0_4px_30px_rgba(255,255,255,0.05),0_10px_40px_rgba(0,0,0,0.8)] flex flex-col items-center justify-center">
<!-- Projected Numeral -->
<div class="font-display-lg text-display-lg text-on-background tracking-tighter drop-shadow-[0_2px_10px_rgba(246,222,210,0.2)]">
                    585°
                </div>
</div>
</div>
<!-- Coaching Text & Data -->
<div class="flex flex-col items-center mt-lg space-y-md text-center">
<h1 class="font-headline-md text-headline-md text-on-background max-w-[280px]">
                Place back on DabRite.
            </h1>
<!-- Glass Chip: Cool Rate -->
<div class="glass-panel rounded-full px-sm py-xs flex items-center gap-xs">
<span class="material-symbols-outlined text-tertiary text-[16px]" data-icon="ac_unit" data-weight="fill" style="font-variation-settings: 'FILL' 1;">ac_unit</span>
<span class="font-data-label text-data-label text-tertiary tracking-widest">
                    COOL RATE 2.4°/s
                </span>
</div>
</div>
</main>
<!-- Fixed Bottom Action Anchor -->
<div class="fixed bottom-xl w-full flex justify-center px-container-padding z-50">
<button class="emissive-pill rounded-full px-lg py-sm flex items-center gap-xs transition-transform hover:scale-105 active:scale-95 group">
<span class="font-data-label text-data-label tracking-[0.2em]">LIFT TO DAB</span>
<span class="material-symbols-outlined text-on-primary-container text-[18px] group-hover:-translate-y-0.5 transition-transform" data-icon="arrow_upward">arrow_upward</span>
</button>
</div>
</body></html>
